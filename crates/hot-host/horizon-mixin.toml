# PL: `hot-host` (D2, M1.3): mod natywny Horizona, który ładuje `hot-core` i przekazuje mu haki.
# Paczkę do budowy składa `build-bundle.sh` (dokłada kopię `crates/hot-abi` jako `hot_abi`).
# EN: `hot-host` (D2, M1.3): a Horizon native mod that loads `hot-core` and forwards hooks to it.
# `build-bundle.sh` assembles the bundle for the build (adds a copy of `crates/hot-abi` as `hot_abi`).
[mod]
id = "hot_host"
version = "0.1.0"

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[api]
path = "api"

[[crate]]
id = "hot_abi"
path = "hot_abi"

# PL: Rozgrzany silnik (D11, S13): na zajętym świecie silnik serwera czeka, aż poprzedni go zwolni,
# zamiast kończyć się błędem. Wszystko przed wczytaniem świata dzieje się więc przed zamrożeniem.
# EN: Warm engine (D11, S13): on a world in use the server engine waits for the previous one to
# release it instead of failing, so everything before the world load happens before the freeze.
[[injection]]
id = "wait_for_world"
target = "horizon_client::game::world_loading::WorldRequest::prepare_world"
kind = "HEAD"
helper = "wait_for_world.rs"
bindings = [
  { name = "request", ty = "&WorldRequest", value = "&self" },
  { name = "options", ty = "&Options", value = "options" },
]
